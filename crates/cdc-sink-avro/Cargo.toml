[package]
name = "cdc-sink-avro"
version = "0.1.0"
edition = "2024"

[dependencies]
apache-avro = { version = "0.18", features = ["derive", "snappy"] }
async-trait = "0.1"
cdc-core = { path = "../cdc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
