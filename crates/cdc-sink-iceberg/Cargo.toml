[package]
name = "cdc-sink-iceberg"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "57"
arrow-json = "57"
arrow-schema = "57"
async-trait = "0.1"
cdc-core = { path = "../cdc-core" }
iceberg = "0.9"
parquet = "57"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
futures = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
