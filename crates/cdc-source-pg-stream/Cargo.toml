[package]
name = "cdc-source-pg-stream"
version = "0.1.0"
edition = "2024"

[dependencies]
cdc-core = { path = "../cdc-core" }
cdc-source-pg-common = { path = "../cdc-source-pg-common" }
async-trait = "0.1"
thiserror = "2"
bytes = "1"
hex = "0.4"
pgwire-replication = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
