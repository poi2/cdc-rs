[package]
name = "cdc-sink-file"
version = "0.1.0"
edition = "2024"

[dependencies]
cdc-core = { path = "../cdc-core" }
anyhow = "1"
async-trait = "0.1"
serde = "1"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
