[package]
name = "cdc-source-pg-polling"
version = "0.1.0"
edition = "2024"

[dependencies]
cdc-core = { path = "../cdc-core" }
cdc-source-pg-core = { path = "../cdc-source-pg-core" }
anyhow = "1"
async-trait = "0.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
