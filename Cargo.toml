[workspace]
members = ["crates/*"]

[package]
name = "cdc-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cdc-core = { path = "crates/cdc-core" }
cdc-source-pg-polling = { path = "crates/cdc-source-pg-polling" }
cdc-sink-pubsub = { path = "crates/cdc-sink-pubsub" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
cdc-source-file = { path = "crates/cdc-source-file" }
cdc-sink-file = { path = "crates/cdc-sink-file" }
google-cloud-pubsub = "0.30"
google-cloud-googleapis = "0.16"
hex = "0.4"
tempfile = "3"
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
